name: Publish packages

on:
  push:
    tags:
      - "@impactx/ui@*"
      - "@impactx/tokens@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build @impactx/tokens
        if: startsWith(github.ref, 'refs/tags/@impactx/tokens@')
        run: pnpm --filter @impactx/tokens build

      - name: Publish @impactx/tokens
        if: startsWith(github.ref, 'refs/tags/@impactx/tokens@')
        run: pnpm --filter @impactx/tokens publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build @impactx/ui
        if: startsWith(github.ref, 'refs/tags/@impactx/ui@')
        run: pnpm --filter @impactx/ui build

      - name: Publish @impactx/ui
        if: startsWith(github.ref, 'refs/tags/@impactx/ui@')
        run: pnpm --filter @impactx/ui publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
