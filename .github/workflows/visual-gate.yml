name: Visual Regression + A11y

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ds-education/**"
      - "packages/cli/**"

jobs:
  visual:
    name: Playwright visual + axe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (required for apps/web resolution)
        run: |
          pnpm tokens:build
          pnpm --filter @impactxlabs/ui build

      - name: Install Playwright Chromium
        run: pnpm --filter @impactx/web exec playwright install chromium

      - name: Run visual + a11y tests
        run: pnpm --filter @impactx/web test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
